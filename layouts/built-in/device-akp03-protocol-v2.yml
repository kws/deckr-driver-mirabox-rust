# AKP03/N3 protocol-v2 form factor: 3x3 keys + 3 dials + 3 buttons.
name: "AKP03_PROTOCOL_V2"

candidate: (vendor_id == 768 and (product_id == 4097 or product_id == 4098 or product_id == 4099)) or (vendor_id == 26114 and product_id == 4098)
match: (vendor_id == 768 and (product_id == 4097 or product_id == 4098 or product_id == 4099)) or (vendor_id == 26114 and product_id == 4098) or search("V2\\.(AKP03|293N3|N3)|AKP03|293N3", firmware)
protocol_version: 2
init_sequence:
  - cmd: wake_display
  - cmd: clear_key
  - cmd: set_brightness
    args:
      value: 100
  - cmd: refresh
teardown_sequence:
  - cmd: clear_key
  - cmd: refresh

image_config:
  key: &key_image_format
    width: 60
    height: 60
    format: "JPEG"

  screen: &screen_image_format
    width: 800
    height: 480
    format: "JPEG"

controls:

  - name: "0,0"
    type: "key"
    events:
      key: 1
    display:
      id: 1
      format: *key_image_format
  
  - name: "1,0"
    type: "key"
    events:
      key: 2
    display:
      id: 2
      format: *key_image_format

  - name: "2,0"
    type: "key"
    events:
      key: 3
    display:
      id: 3
      format: *key_image_format

  - name: "0,1"
    type: "key"
    events:
      key: 4
    display:
      id: 4
      format: *key_image_format

  - name: "1,1"
    type: "key"
    events:
      key: 5
    display:
      id: 5
      format: *key_image_format

  - name: "2,1"
    type: "key"
    events:
      key: 6
    display:
      id: 6
      format: *key_image_format

  - name: "3,0"
    type: "dial"
    events:
      clockwise: 81
      counterclockwise: 80
      key: 53

  - name: "3,1"
    type: "dial"
    events:
      clockwise: 145
      counterclockwise: 144
      key: 51

  - name: "4,1"
    type: "dial"
    events:
      clockwise: 97
      counterclockwise: 96
      key: 52

  - name: "B1"
    type: "button"
    events:
      key: 37

  - name: "B2"
    type: "button"
    events:
      key: 48

  - name: "B3"
    type: "button"
    events:
      key: 49
